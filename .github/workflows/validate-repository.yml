name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository setup validation
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run core contract tests
        shell: powershell
        run: |
          $paths = @(
            '.github/cli/tests/WorkflowContract.Tests.ps1'
            '.github/cli/tests/RepositorySafety.Tests.ps1'
            'infra/tests/pester'
          )
          Invoke-Pester -Path $paths -Output Detailed -CI

      - name: Run repository safety validation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/cli/verify-repository-safety.ps1

      - name: Build Bicep
        shell: powershell
        run: az bicep build --file infra/src/bicep/main.bicep --stdout

      - name: Check branch whitespace
        shell: powershell
        run: git diff --check origin/main...HEAD